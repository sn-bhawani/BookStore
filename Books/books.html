<!DOCTYPE html>
<html ng-app="kindle">
<head>
    <title>Books</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
    <script src="main.js"></script>
    <link rel="stylesheet" href="vid.css">
</head>
<body ng-controller="storemanager">

    <h1>{{title}}</h1>

    <div class="products-container">
        <div class="product-card" ng-repeat="book in bookstore">
            <img ng-src="{{book.url}}" alt="{{book.name}}">
            <h3>{{book.name}} | {{book.author}}</h3>
            <p>₹{{book.price}}</p>
        </div>
    </div>

</body>
</html>
