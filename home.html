<!DOCTYPE html>
<html ng-app="kindle">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore | HomePage</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
<!-- Add this line: -->
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.js"></script>
    <script src="main.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geomini:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
        * {
            margin: 0;
            padding: 0;
            font-family: 'Geomini';
            user-select: none;
        }
        :root {
            --primary: #371947;
            --secondary: #4f3e58;
            --gray: #5b5b5b;
        }
        body {
            background-color: white;
        }
        header {
            background-color: var(--primary); 
            display: grid;
            box-shadow: -2px 5px 0px 0px #4abdff1a;
        }
        header .header-top {
            display: flex;
            gap: 20px;
            justify-content: center;
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid white;
            color: white;
        }
        .header-top h1 {
            place-content: center;
        }
        header nav {
            background-color: var(--secondary);
        }
        nav ul {
            display: flex;
            list-style: none;
            align-items: center;
            gap: 10px;
            place-content: center;
        }
        ul li {
            padding: 12px 20px;
            transition: .4s ease-in-out;
        }
        ul li:hover {
            background-color: white;
            color: black;
        }
        ul li:hover a {
            color: var(--primary);
        }
        ul li a {
            text-decoration: none;
            color: white;
        }

        /* SECTION */
        section {
            margin-top: 80px;
            margin-bottom: 80px;
            background-color: white;
        }
        section#overview {
            display: flex;
            gap: 50px;
            justify-content: center;
            align-items: center;
        }
        section#overview img {
            width: 400px;
        }
        section#overview h1 {
            line-height: 50px;
            text-align: start;
            color: var(--gray);
        }

        section .title {
            padding: 10px 20px;
            color: orange;
            min-width: 200px;
            max-width: fit-content;
            box-shadow: -6px 3px 3px 0px #00000026;
            border-bottom: 4px solid orange;
        }

        .books_container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            margin: 20px 50px;
        }
        .books_container .books_item {
            background-color: white;
            height: auto;
            width: 250px;
            border: 1px solid #fafafa;
            place-content: center;
            transition: .4s ease-in-out;
            padding: 10px;
            cursor: pointer;
        }
        .books_container .books_item:hover {
            scale: 1.2;
            box-shadow: -1px 3px 1px 2px #00000017;
            background-color: #fafafa;
        }
        .books_container .books_item:hover .book-data {
            color: black;
        }
        .books_container .books_item img {
            width: 100%;
            height: 200px;
            transition: .4s ease-in-out;
        }

        .books_item .book-data {
            padding: 10px 20px;
            display: grid;
            gap: 10px;
        }
        .book-data .book-price {
            color: orange;
            font-size: 20px;
        }

        .books_item .add-to-cart {
            padding: 10px;
            background-color: #fafafa;
            color: black;
            border: none;
            width: 100%;
            cursor: pointer;
            border-radius: 30px;
            transition: .2s ease-in-out;
        }
        .books_container .books_item:hover img {
            scale: 0.8;
            opacity: .8;
        }
        .books_container .books_item:hover .add-to-cart {
            background-color: var(--primary);
            color: white;
        }
        .text-center {
            text-align: center;
        } 

        .item-bar {
            width: 100%;
            height: 5px;
        }

        #about {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #about .about-container {
            position: relative;
            display: grid;
            gap: 50px;
        }
        .about-container h1 {
            text-shadow: 2px 5px 1px #00000026;
            text-transform: uppercase;
            font-size: 60px;
        }
        .about-container .label1 {
            color: #656665;
        }
        .about-container .label2 {
            color: #4cb4e6;
            margin-left: 50px;
        }
        .about-container .label3 {
            color: #ff6504;
            margin-left: 100px;
        }

    </style>
</head>
<body ng-controller="storemanager"> 
        <section id="overview">

             <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrSIDJiRbJ3jcl0erQ7wGYaPVCuW1_0artyYCVDdo7yg&s=10" alt="Kindle">

            <h1>Welcome to Kindle 2.0<br> Powered By Amazon Kindle</h1>

        </section>

        <!-- Our Books -->

        <section id="books">
            <h2 class="title">Our Popular Books</h2>

            <div class="books_container">

                <div class="books_item" ng-repeat="book in bookstore">
                    <img src="{{book.url}}" alt="{{book.name}}">
                    <div class="book-data">
                        <p class="text-center">{{book.name}} | {{book.author}}</p>
                        <p class="text-center book-price">{{book.price}}</p>
                    </div>
                    <button class="add-to-cart">Add To Cart</button>
                    
                </div>

                

            </div>

        </section>

        <section id="about">
            <img src="bulb.png" alt="Knowledge Bulk">

            <div class="about-container">
                <h1 class="label1">Igniting minds</h1>
                <h1 class="label2">Shaping futures</h1>
                <h1 class="label3">Breaking boundaries<h1>
            </div>

        </section>
 
</body>
</html>
